name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: unzip -o projet.zip -d . && for z in traca-maj-*.zip; do test -f $z && unzip -o $z -d . ; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bibliothèques pour fonctionner sans Internet
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js -o app/src/main/assets/zxing.min.js

      - name: Construire
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Traca-Boucherie-Mmarket.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Traça Boucherie Mmarket v${{ github.run_number }}
          files: Traca-Boucherie-Mmarket.apk
          make_latest: true
